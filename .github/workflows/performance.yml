name: Performance Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run performance tests weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

jobs:
  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: http://localhost:3000/api
          VITE_WS_URL: http://localhost:3000

      - name: Start services for testing
        run: |
          # Start mock backend for lighthouse testing
          cd frontend
          npx serve -s dist -l 3001 &
          sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouse-ci.json'
          urls: |
            http://localhost:3001
            http://localhost:3001/login
          uploadArtifacts: true
          temporaryPublicStorage: true

  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eli5_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd backend && npm ci

      - name: Setup database
        run: |
          cd backend
          npx prisma generate
          npx prisma db push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/eli5_test

      - name: Start backend server
        run: |
          cd backend
          npm run build
          npm start &
          sleep 10
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/eli5_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          PORT: 3000

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create k6 test script
        run: |
          mkdir -p tests/performance
          cat > tests/performance/load-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate } from 'k6/metrics';

          export let errorRate = new Rate('errors');

          export let options = {
            stages: [
              { duration: '2m', target: 10 }, // Ramp up
              { duration: '5m', target: 10 }, // Stay at 10 users
              { duration: '2m', target: 20 }, // Ramp up to 20 users
              { duration: '5m', target: 20 }, // Stay at 20 users
              { duration: '2m', target: 0 },  // Ramp down
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'], // 95% of requests must complete below 500ms
              errors: ['rate<0.1'], // Error rate must be below 10%
            },
          };

          const BASE_URL = 'http://localhost:3000/api';

          export default function() {
            // Health check
            let response = http.get(`${BASE_URL}/health`);
            check(response, {
              'health check status is 200': (r) => r.status === 200,
            }) || errorRate.add(1);

            sleep(1);

            // Test user registration (with random email)
            const randomEmail = `test${Math.random()}@example.com`;
            response = http.post(`${BASE_URL}/auth/register`, JSON.stringify({
              email: randomEmail,
              password: 'Password123!',
              firstName: 'Load',
              lastName: 'Test'
            }), {
              headers: { 'Content-Type': 'application/json' },
            });

            const registrationSuccess = check(response, {
              'registration status is 201': (r) => r.status === 201,
            });

            if (registrationSuccess) {
              const authData = response.json();
              const token = authData.data.tokens.accessToken;

              sleep(1);

              // Test authenticated endpoints
              response = http.get(`${BASE_URL}/auth/me`, {
                headers: { 'Authorization': `Bearer ${token}` },
              });
              check(response, {
                'get profile status is 200': (r) => r.status === 200,
              }) || errorRate.add(1);

              sleep(1);

              // Test video listing
              response = http.get(`${BASE_URL}/videos`, {
                headers: { 'Authorization': `Bearer ${token}` },
              });
              check(response, {
                'get videos status is 200': (r) => r.status === 200,
              }) || errorRate.add(1);

              sleep(1);

              // Test video stats
              response = http.get(`${BASE_URL}/videos/stats/overview`, {
                headers: { 'Authorization': `Bearer ${token}` },
              });
              check(response, {
                'get stats status is 200': (r) => r.status === 200,
              }) || errorRate.add(1);
            } else {
              errorRate.add(1);
            }

            sleep(2);
          }
          EOF

      - name: Run load tests
        run: |
          k6 run tests/performance/load-test.js --out json=performance-results.json

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: performance-results.json

  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd backend && npm ci

      - name: Install clinic.js for profiling
        run: npm install -g clinic

      - name: Run memory profiling
        run: |
          cd backend
          npm run build
          
          # Start with memory profiling
          clinic doctor --on-port 'curl http://localhost:3000/api/health' -- node dist/index.js &
          PID=$!
          
          sleep 30
          
          # Generate some load
          for i in {1..100}; do
            curl -s http://localhost:3000/api/health > /dev/null
          done
          
          sleep 10
          kill $PID
        env:
          NODE_ENV: production
          DATABASE_URL: file:./test.db
          REDIS_URL: redis://localhost:6379

      - name: Upload profiling results
        uses: actions/upload-artifact@v3
        with:
          name: memory-profiling-results
          path: backend/.clinic/

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Analyze bundle size
        run: |
          cd frontend
          npm run build
          npx vite-bundle-analyzer dist --mode static

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v3
        with:
          name: bundle-analysis
          path: frontend/dist/bundle-analysis.html

  performance-regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build baseline
        run: |
          cd frontend
          npm ci
          npm run build
          du -sh dist/ > ../baseline-size.txt

      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Build PR version
        run: |
          cd frontend
          npm ci
          npm run build
          du -sh dist/ > ../pr-size.txt

      - name: Compare bundle sizes
        run: |
          echo "## 📦 Bundle Size Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Version | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Base | $(cat baseline-size.txt | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| PR | $(cat pr-size.txt | cut -f1) |" >> $GITHUB_STEP_SUMMARY

  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [lighthouse-audit, load-testing, bundle-analysis]
    if: always()
    steps:
      - name: Generate performance report
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = [
              { name: 'Lighthouse Audit', result: '${{ needs.lighthouse-audit.result }}' },
              { name: 'Load Testing', result: '${{ needs.load-testing.result }}' },
              { name: 'Bundle Analysis', result: '${{ needs.bundle-analysis.result }}' }
            ];
            
            const summary = `## ⚡ Performance Testing Summary
            
            ### Test Results:
            ${jobs.map(job => `- **${job.name}**: ${job.result === 'success' ? '✅ Passed' : job.result === 'failure' ? '❌ Failed' : '⏭️ Skipped'}`).join('\n')}
            
            ### Key Metrics Monitored:
            - 🚀 **Page Load Speed**: < 3s first contentful paint
            - 📊 **API Response Time**: < 500ms for 95th percentile
            - 💾 **Memory Usage**: Stable under load
            - 📦 **Bundle Size**: Monitored for regressions
            
            Check individual job artifacts for detailed performance data.`;
            
            core.summary.addRaw(summary);
            await core.summary.write();